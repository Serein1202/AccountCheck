name: Build & Release

# 每次 push 到 main：打包成单文件 exe → 校验 → 覆盖发布到 Releases 的 latest
on:
  push:
    branches: [main]
  workflow_dispatch:          # 也支持在 Actions 页面手动触发

# 创建/更新 Release 需要写权限
permissions:
  contents: write

# 同一分支连续 push 时，取消进行中的旧构建，避免两个构建同时改 latest 造成错乱
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and release exe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # 基础版本取源码里的 VERSION 常量（如 1.0.0），patch 位用 CI 构建号：
          # 每次推送 run_number 自动 +1 → 发布版本号随之递增（v1.0.3、v1.0.4…）
          BASE=$(grep -oP '^VERSION\s*=\s*"\K[^"]+' joint_query.py | head -n1)
          if [ -z "$BASE" ]; then
            echo "::error::未能从 joint_query.py 提取 VERSION，请检查该常量是否存在"
            exit 1
          fi
          RUN_NUM=${{ github.run_number }}
          VERSION="${BASE%.*}.${RUN_NUM}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号：v$VERSION（base=$BASE，patch=build #${RUN_NUM}）"
          # 生成构建版本文件，随 PyInstaller 打进 exe，使 exe 内 --version 与 Release 名一致
          printf 'BUILD_VERSION = "%s"\n' "$VERSION" > _build_version.py

      # 关键一步：把仓库 Secret 里的授权码落到工作区的 license.key，
      # 随后由 PyInstaller 的 --add-data 打进 exe（运行期从 sys._MEIPASS 读取）。
      # license.key 已在 .gitignore 中，不会被提交；Secret 在日志里由 GitHub 自动打码。
      - name: Inject license key (secret APP_LICENSE_KEY)
        shell: bash
        env:
          APP_LICENSE_KEY: ${{ secrets.APP_LICENSE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_LICENSE_KEY//[[:space:]]/}" ]; then
            echo "::error::仓库 Secret APP_LICENSE_KEY 未配置或为空（Settings → Secrets and variables → Actions → New repository secret）"
            exit 1
          fi
          printf '%s\n' "$APP_LICENSE_KEY" > license.key
          echo "已写入 license.key（长度 ${#APP_LICENSE_KEY}）"

      - name: Record build time
        id: meta
        shell: bash
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.18.0" pillow

      # --paths vendor + --hidden-import license_guard：
      # license_boot 是在运行时用 sys.path 动态加载 license_guard 的，
      # PyInstaller 静态分析看不到这个导入，必须显式告诉它去哪找、并强制打包。
      - name: Build single-file exe
        run: >
          python -m PyInstaller --noconfirm --clean
          --onefile --windowed
          --name AccountCheck
          --paths src --paths src/vendor
          --hidden-import license_guard
          --add-data "license.key;."
          joint_query.py

      # 打包产物必须真能跑起来才算成功：exe 里跑一次离线自检，退出码非 0 直接中止。
      # 这一条能挡住「漏打模块 / 授权码没进包 / 冻结后路径写错」这类只在 exe 上暴露的问题。
      - name: Verify artifact (run offline selfcheck inside the exe)
        shell: pwsh
        run: |
          if (-not (Test-Path ./dist/AccountCheck.exe)) {
            Write-Error "未生成 dist/AccountCheck.exe"
            exit 1
          }
          Write-Host "===== AccountCheck.exe --selfcheck ====="
          $p = Start-Process -FilePath ./dist/AccountCheck.exe -ArgumentList '--selfcheck' -Wait -PassThru
          Write-Host "===== selfcheck 退出码：$($p.ExitCode) ====="
          if ($p.ExitCode -ne 0) {
            Write-Error "打包产物自检未通过（退出码 $($p.ExitCode)），已中止发布"
            exit 1
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./dist/AccountCheck.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AccountCheck.exe" | Set-Content ./dist/AccountCheck.exe.sha256 -Encoding ascii
          $size = [math]::Round((Get-Item ./dist/AccountCheck.exe).Length / 1MB, 2)
          Write-Host "SHA256: $hash"
          Write-Host "体积: $size MB"

      - name: Upload build artifact (kept 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: AccountCheck-v${{ steps.ver.outputs.version }}
          path: |
            dist/AccountCheck.exe
            dist/AccountCheck.exe.sha256
          retention-days: 90

      # 滚动发布：始终更新同一个 latest Release，下载链接固定不变。
      # 旧构建仍可在本次运行的 Artifacts 里找到（保留 90 天）。
      - name: Publish to Releases (rolling latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AccountCheck v${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            **AccountCheck v${{ steps.ver.outputs.version }}**（build #${{ github.run_number }}）

            | | |
            |---|---|
            | 版本 | v${{ steps.ver.outputs.version }} |
            | 构建号 | #${{ github.run_number }} |
            | 提交 | [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
            | 分支 | `${{ github.ref_name }}` |
            | 构建时间 | ${{ steps.meta.outputs.time }} |

            **下载**：`AccountCheck.exe` —— 单文件、免安装，双击即用（Windows 10/11 x64）。
            文件校验和见 `AccountCheck.exe.sha256`。

            > 本 Release 为滚动更新：每次推送到 `main` 都会覆盖这里的文件，下载链接固定不变。
            > 历史构建可在该次运行的 Actions → Artifacts 中下载（保留 90 天）。
          files: |
            dist/AccountCheck.exe
            dist/AccountCheck.exe.sha256
